set -g mouse on
set -g base-index 1
set -g renumber-windows on

set -s set-clipboard on
set -g allow-passthrough on
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm*:extkeys'

# set -g focus-events on

unbind C-b
set-option -g prefix `
bind-key ` send-prefix

# prefix + - : split top/bottom, prefix + | : split left/right
bind-key - split-window -v -c '#{pane_current_path}'
bind-key | split-window -h -c '#{pane_current_path}'

# Ctrl+. : switch to another pane in the current window
#   2 panes  -> jump straight to the other one
#   3+ panes -> pick one in the fzf popup below
# select-pane -Z keeps a zoomed window zoomed on the pane we land on
bind-key -n C-. if-shell -F '#{>:#{window_panes},2}' \
  'display-popup -E -w 75% -h 60% -T " switch pane " "$XDG_CONFIG_HOME/tmux/scripts/switch-pane.sh"' \
  'select-pane -Z -t :.+'

# Ctrl+q : enter copy mode, same as prefix + [
bind-key -n C-q copy-mode

run-shell 'tmux source-file "$XDG_CONFIG_HOME/tmux/colorschemes/tokyonight_moon.tmux"'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'mrjones2014/smart-splits.nvim'

# Other examples:
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# Keep TPM and its plugins out of this repository.  With tmux.conf at the XDG
# location TPM would default to $XDG_CONFIG_HOME/tmux/plugins, which after
# install.sh is a symlink back into the repo.  Must come before the run line
# below, because TPM only computes its default when the variable is unset.
run-shell 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins/"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'
